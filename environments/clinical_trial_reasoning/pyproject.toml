[project]
name = "clinical-trial-reasoning"
version = "0.1.0"
description = "Staged closed-book reasoning about clinical trial outcomes (S1/S2/S6, arm A)."
requires-python = ">=3.11"
dependencies = ["verifiers"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["clinical_trial_reasoning"]
